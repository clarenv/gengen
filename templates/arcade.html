<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Arcade | Gelgel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <!-- Link sa CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/arcade.css') }}">
</head>
<body>

    <div class="container">
        <a href="/" class="back-btn">← BACK TO LOBBY</a>
        <h1>THE <span class="gold">ARCADE</span></h1>

        <div class="tabs">
            <button class="tab active" onclick="switchTab(event, 'tab-color')">🎨 COLOR</button>
            <button class="tab" onclick="switchTab(event, 'tab-uno')">🃏 UNO</button>
            <button class="tab" onclick="switchTab(event, 'tab-memory')">🧠 MEMORY</button>
        </div>

        <!-- COLOR GAME -->
        <div class="panel active" id="tab-color">
            <h2>GUESS THE COLOR</h2>
            <div class="c-box" id="cBox" style="background:#333;">READY?</div>
            <div class="c-opts" id="cOpts"></div>
            <h3 id="cMsg">Press START!</h3>
            <p>Score: <span id="cScore" class="gold">0</span></p>
            <button class="action" id="cStart" onclick="startColor()">START GAME</button>
        </div>

        <!-- UNO GAME -->
        <div class="panel" id="tab-uno">
            <h2>UNO VS CPU</h2>
            <p>Your Cards: <span id="uPCount" class="gold">0</span> | CPU Cards: <span id="uCCount" class="gold">0</span></p>
            <div class="u-top" id="uTop">—</div>
            <h3 id="uMsg">Press START!</h3>
            <div class="u-hand" id="uHand"></div>
            <button class="action" onclick="startUno()">START GAME</button>
        </div>

        <!-- MEMORY GAME -->
        <div class="panel" id="tab-memory">
            <h2>MEMORY MATCH</h2>
            <p>Moves: <span id="mMoves" class="gold">0</span> | Pairs: <span id="mPairs" class="gold">0</span>/4</p>
            <div class="m-grid" id="mGrid"></div>
            <h3 id="mMsg">Press RESTART!</h3>
            <button class="action" onclick="initMemory()">RESTART GAME</button>
        </div>
    </div>

    <!-- Link sa JS -->
    <script src="{{ url_for('static', filename='js/arcade.js') }}"></script>
</body>
</html>
