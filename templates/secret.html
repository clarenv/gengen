<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>??? | A Little Universe</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/secret.css') }}">
</head>
<body>

    <!-- ==============================
         ELEVATOR GOING UP (ASCEND) OVERLAY
    =============================== -->
    <div id="elevatorUpOverlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #050505; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; transform: translateY(100%); transition: transform 2.5s cubic-bezier(0.77, 0, 0.175, 1); pointer-events: none;">
        <div class="elevator-label">ASCENDING</div>
        <div class="floor-display" id="upFloorNum">B1</div>
        <div class="elevator-status">
            <span class="dot"></span> GOING UP
        </div>
    </div>

    <!-- ==============================
         ELEVATOR LOADING OVERLAY
    =============================== -->
    <div id="elevator-overlay">
        <div class="elevator-label">DESCENDING</div>
        <div class="floor-display" id="floorNum">B1</div>
        <div class="elevator-status">
            <span class="dot"></span> GOING DOWN
        </div>
    </div>

    <!-- ==============================
         GALAXY UNIVERSE
    =============================== -->
    <div id="galaxy" class="galaxy">
        <!-- Background stars layer -->
        <div class="stars-bg" id="starsBg"></div>

        <!-- Intro welcome message -->
        <div class="welcome-intro" id="welcomeIntro">
            <p class="welcome-small">A little universe</p>
            <h1 class="welcome-title">Made Just for <span id="introName">You</span></h1>
        </div>

        <!-- Central Moon -->
        <div class="moon-wrapper" id="moonWrapper">
            <div class="moon" id="moon">
                <div class="moon-img" id="moonImg"></div>
                <div class="moon-glow"></div>
            </div>
            <div class="moon-name" id="moonName">You</div>
        </div>

        <!-- Orbit container (stars will be injected here) -->
        <div class="orbit-system" id="orbitSystem"></div>

        <!-- ==============================
             CONTROLS (Dito na nakalagay ang lahat)
        =============================== -->
        <div class="controls">
            <!-- BAGONG BUTTON: BACK TO ARCADE (Nilipat sa tabi ng music) -->
            <button id="upElevatorBtn" class="ctrl-btn" style="width: auto; padding: 0 15px; border-radius: 20px; font-size: 0.8rem; letter-spacing: 1px;" title="Return to Arcade">
                ↑ ARCADE
            </button>

            <button class="ctrl-btn" id="musicBtn" title="Toggle Music">♪</button>
            <button class="ctrl-btn" id="settingsBtn" title="Settings">⚙</button>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <h3>Configure Your Universe</h3>
            
            <label>Recipient Name</label>
            <input type="text" id="setName" placeholder="e.g. Gelgel">

            <label>Upload Profile Picture</label>
            <input type="file" id="setPhoto" accept="image/*">

            <label>Add Message</label>
            <input type="text" id="setMsgTitle" placeholder="Title (e.g. First Date)">
            <textarea id="setMsgContent" placeholder="Your message..." rows="3"></textarea>
            <input type="date" id="setMsgDate">

            <div class="panel-actions">
                <button id="addMsgBtn" class="panel-btn">+ Add Message</button>
                <button id="closeSettingsBtn" class="panel-btn ghost">Close</button>
            </div>

            <div class="msg-list" id="msgList"></div>
        </div>

        <!-- Message Popup -->
        <div class="popup-overlay" id="popupOverlay">
            <div class="popup" id="popup">
                <button class="popup-close" id="popupClose">✕</button>
                <div class="popup-date" id="popupDate"></div>
                <h2 class="popup-title" id="popupTitle"></h2>
                <div class="popup-divider"></div>
                <p class="popup-content" id="popupContent"></p>
            </div>
        </div>

        <!-- Moon Final Message -->
        <div class="popup-overlay" id="finalOverlay">
            <div class="popup final-popup">
                <button class="popup-close" id="finalClose">✕</button>
                <h2 class="popup-title gold-glow">You Are My Universe</h2>
                <div class="popup-divider"></div>
                <p class="popup-content">
                    Every star in this sky, every orbit in this system —<br>
                    they all revolve around you.<br><br>
                    <em>Always have. Always will.</em>
                </p>
            </div>
        </div>

        <!-- ==============================
             AUDIO ELEMENTS
        =============================== -->
        <!-- Background Music -->
        <audio id="bgMusic" loop>
            <source src="{{ url_for('static', filename='audio/romantic.mp3') }}" type="audio/mpeg">
        </audio>

        <!-- ELEVATOR SOUNDS -->
        <audio id="elevatorDing" preload="auto">
            <source src="{{ url_for('static', filename='audio/elevator-ding.mp3') }}" type="audio/mpeg">
        </audio>

        <audio id="elevatorHum" preload="auto" loop>
            <source src="{{ url_for('static', filename='audio/elevator-hum.mp3') }}" type="audio/mpeg">
        </audio>
    </div>

    <script src="{{ url_for('static', filename='js/secret.js') }}"></script>
</body>
</html>
